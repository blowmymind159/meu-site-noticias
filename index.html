<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Minimalist</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            line-height: 1.6;
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        header {
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid rgba(148, 163, 184, 0.15);
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .subtitle { color: #94a3b8; font-size: 1rem; }

        .filters {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.2);
            color: #e2e8f0;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        .filter-btn:hover {
            background: rgba(96, 165, 250, 0.2);
            border-color: #60a5fa;
        }

        .filter-btn.active {
            background: #60a5fa;
            color: #0f172a;
            border-color: #60a5fa;
        }

        .news-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .news-item {
            display: grid;
            grid-template-columns: 80px 1fr auto;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid rgba(148, 163, 184, 0.1);
            border-radius: 8px;
            transition: all 0.2s;
        }

        .news-item:hover {
            background: rgba(30, 41, 59, 0.6);
            border-color: rgba(96, 165, 250, 0.3);
            transform: translateX(4px);
        }

        .score {
            font-weight: 700;
            font-size: 1.1rem;
            color: #60a5fa;
            text-align: center;
        }

        .score.high { color: #a78bfa; }
        .score.very-high { color: #f472b6; }

        .title {
            font-size: 1rem;
            font-weight: 500;
        }

        .title a {
            color: #f1f5f9;
            text-decoration: none;
        }

        .title a:hover { color: #60a5fa; }

        .meta {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.85rem;
            color: #64748b;
        }

        .source {
            background: rgba(148, 163, 184, 0.1);
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
        }

        .loading, .error, .empty {
            text-align: center;
            padding: 3rem;
            color: #64748b;
        }

        .error { color: #f87171; }

        @media (max-width: 768px) {
            .news-item {
                grid-template-columns: 60px 1fr;
                gap: 0.5rem;
            }
            .meta {
                grid-column: 2;
                justify-content: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>News Minimalist</h1>
            <p class="subtitle">Notícias curadas por inteligência artificial</p>
        </header>

        <div class="filters">
            <button class="filter-btn active" onclick="filterNews('all')">Todas</button>
            <button class="filter-btn" onclick="filterNews('significant')">Significativas (≥5.5)</button>
            <button class="filter-btn" onclick="filterNews('latest')">Mais recentes</button>
        </div>

        <div id="news-container" class="news-list">
            <p class="loading">A carregar notícias...</p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://jqgvuherkhlbcdsoukfh.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxZ3Z1aGVya2hsYmNkc291a2ZoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyMDA0MjMsImV4cCI6MjEwODc3NjQyM30.yd7njb80EawHJj8uRGF7KqKbvXshyYOseyxpNdW3hXE';

        const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let allNews = [];

        function getScoreClass(score) {
            if (score >= 7.0) return 'very-high';
            if (score >= 5.5) return 'high';
            return '';
        }

        function formatTime(publishedAt) {
            if (!publishedAt) return 'recente';
            const date = new Date(publishedAt);
            if (isNaN(date.getTime())) return 'recente';
            const diffHours = Math.floor((Date.now() - date.getTime()) / (1000 * 60 * 60));
            if (diffHours < 1) return 'agora';
            if (diffHours < 24) return diffHours + 'h';
            const diffDays = Math.floor(diffHours / 24);
            if (diffDays < 7) return diffDays + 'd';
            return date.toLocaleDateString('pt-PT', { day: 'numeric', month: 'short' });
        }

        function renderNews(news) {
            const container = document.getElementById('news-container');
            if (news.length === 0) {
                container.innerHTML = '<p class="empty">Nenhuma notícia encontrada.</p>';
                return;
            }
            container.innerHTML = news.map(n => `
                <div class="news-item">
                    <div class="score ${getScoreClass(n.score)}">[${n.score.toFixed(1)}]</div>
                    <div class="title"><a href="${n.url}" target="_blank" rel="noopener">${n.titulo}</a></div>
                    <div class="meta">
                        <span class="source">${n.fonte}</span>
                        <span>${formatTime(n.publicado_em || n.created_at)}</span>
                    </div>
                </div>
            `).join('');
        }

        function filterNews(type) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            let filtered = allNews;
            if (type === 'significant') {
                filtered = allNews.filter(n => n.score >= 5.5);
            } else if (type === 'latest') {
                filtered = [...allNews].sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            }
            renderNews(filtered);
        }

        async function carregarNoticias() {
            const container = document.getElementById('news-container');
            try {
                const { data, error } = await client
                    .from('noticias')
                    .select('*')
                    .order('score', { ascending: false })
                    .limit(100);

                if (error) {
                    container.innerHTML = `<p class="error">Erro ao carregar: ${error.message}</p>`;
                    return;
                }

                allNews = data || [];
                renderNews(allNews);
            } catch (err) {
                container.innerHTML = `<p class="error">Erro ao carregar: ${err.message}</p>`;
            }
        }

        carregarNoticias();
    </script>
</body>
</html>
